<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Laura Gonzalez</title>
  <meta name="description" content="Get in touch with Laura Gonzalez about commissions, design projects and collaborations.">
  <meta name="theme-color" content="#faf7f0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 fill=%22%23172251%22/%3E%3Cpath d=%22M12 4.5 14 10l5.5 2-5.5 2-2 5.5-2-5.5L4.5 12 10 10z%22 fill=%22%23faf7f0%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="contact">
<main id="main">
  <section class="wrap contact-grid">
    <div>
      <p class="label">Contact</p>
      <h1 class="display"><span lang="es">Hola</span>, let’s <em>talk.</em></h1>
      <p class="lede">Commissions, collaborations, a poster for your society, or just a matcha recommendation. My inbox is open.</p>
      <a class="big-mail link" data-email href="mailto:laauuugc@gmail.com">laauuugc@gmail.com</a>
      <div class="contact-notes">
        <div><span class="label">Based in</span><span>Ireland, originally from Madrid</span></div>
        <div><span class="label">Open to</span><span>Commissions, posters, branding and illustration</span></div>
        <div><span class="label">Languages</span><span>English and Spanish</span></div>
      </div>
    </div>
    <form class="form" aria-labelledby="form-title">
      <h2 id="form-title">Send a message</h2>
      <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="f-topic">Topic <span>(optional)</span></label>
        <select id="f-topic" name="topic"><option>Commission</option><option>Collaboration</option><option>Design project</option><option>Just saying hi</option></select></div>
      <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" required></textarea></div>
      <button class="btn" type="submit">Send message</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
</body>
</html>
