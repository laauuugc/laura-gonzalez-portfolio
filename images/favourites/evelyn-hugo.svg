<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="A signed copy of The Seven Husbands of Evelyn Hugo">
  <g transform="rotate(-6 120 120)">
    <rect x="70" y="30" width="112" height="176" rx="4" fill="#e9e1cf" stroke="#1b1a17" stroke-width="3"/>
    <rect x="58" y="24" width="112" height="176" rx="4" fill="#1f6b52" stroke="#1b1a17" stroke-width="3"/>
    <rect x="58" y="24" width="12" height="176" fill="#16503d" stroke="#1b1a17" stroke-width="3"/>
    <g fill="#f4e7c3" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="120" y="66" font-size="11" letter-spacing="2">THE SEVEN</text>
